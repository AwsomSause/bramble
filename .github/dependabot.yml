version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    # These are pinned to versions that match this project's toolchain and the
    # test environment (Node 22, the plugins' supported ranges, the preinstalled
    # browser). Automatic bumps here have broken the build, so Dependabot leaves
    # them alone — update them by hand after checking compatibility.
    ignore:
      - dependency-name: eslint
      - dependency-name: '@eslint/js'
      - dependency-name: typescript
      - dependency-name: typescript-eslint
      - dependency-name: eslint-plugin-jsx-a11y
      - dependency-name: jsdom
      - dependency-name: '@playwright/test'
      - dependency-name: playwright-core
      - dependency-name: '@types/node'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
