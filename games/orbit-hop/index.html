<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Orbit Hop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="stage" aria-label="Orbit Hop game area"></canvas>
    <div class="hud">
      <span class="score" aria-live="off">Score <b id="score">0</b></span>
      <span class="best">Best <b id="best">0</b></span>
      <button type="button" id="pauseBtn" aria-label="Pause (P)">❚❚</button>
      <button type="button" id="restartBtn" aria-label="Restart (R)">↻</button>
    </div>
    <div class="panel" id="startPanel">
      <h1>Orbit Hop</h1>
      <p>Your berry circles the bush. <b>Hop</b> between the two rings to dodge thorns and grab golden seeds.</p>
      <p class="keys">Tap, click or press <kbd>Space</kbd> to hop · <kbd>P</kbd> pause · <kbd>R</kbd> restart</p>
      <button type="button" id="startBtn" class="big">Start</button>
      <button type="button" id="berryKnock" aria-label="•" title="">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M12 4c2-3 7-3 9-1-3 0-6 1-9 1z" fill="#4f8a2b" />
          <g fill="#6b2d8b">
            <circle cx="8" cy="9" r="3" /><circle cx="14" cy="9" r="3" /><circle cx="6" cy="14" r="3" />
            <circle cx="12" cy="14" r="3" /><circle cx="18" cy="14" r="3" /><circle cx="9" cy="19" r="3" /><circle cx="15" cy="19" r="3" />
          </g>
        </svg>
      </button>
    </div>
    <div class="panel hidden" id="pausePanel">
      <h2>Paused</h2>
      <button type="button" id="resumeBtn" class="big">Resume</button>
    </div>
    <div class="panel hidden" id="overPanel" role="alert">
      <h2>Squished!</h2>
      <p>You scored <b id="finalScore">0</b>.</p>
      <button type="button" id="againBtn" class="big">Play again</button>
    </div>
    <script src="../../bramble-bridge.js"></script>
    <script src="logic.js"></script>
    <script src="game.js"></script>
  </body>
</html>
