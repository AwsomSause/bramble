<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hello Berry</title></head>
<body style="font-family:sans-serif;background:#fbf7f2;color:#3b1d4f;display:grid;place-items:center;height:100vh;margin:0">
<button id="b" style="font-size:24px;padding:12px 24px">Pick a berry: <span id="n">0</span></button>
<script>var n=0;document.getElementById('b').onclick=function(){document.getElementById('n').textContent=++n;};</script>
</body></html>
